      <div style="display:flex;gap:6px"><input type="number" id="ly" value="1990" style="flex:1.1">

  </div>

  <div style="margin-top:14px"><label>查 看 方 式</label>
    <div class="seg" id="md">
      <button data-v="y" class="on">年运：去年·今年·明年</button>

    <input type="hidden" id="cy"><select id="gm" style="display:none"></select>
  </div>

      <span data-k="health" class="on">健康</span></div>
  </div>
  <button class="go" id="go">排 盘 解 读</button>
  <div class="err" id="msg"></div>
</div>

function relate(list,p){
 var n=list.length,fac=[],ev=[],hua={"木":0,"火":0,"土":0,"金":0,"水":0},i,j,k,done={};
 for(i=0;i<n;i++){fac.push(1);}

 function lb(t){return list[t].label+list[t].z;}

  for(j=0;j<3;j++){t=find(c[j],u);if(t<0){ok=false;break;}u.push(t);}

   ev.push({c:"e1",s:"<b>三会"+c[0]+c[1]+c[2]+"</b>（"+lb(u[0])+"·"+lb(u[1])+"·"+lb(u[2])+"）会成"+c[3]+"方，"+c[3]+"气大增 +"+f1(s*K_SANHUI)});}}
 for(i=0;i<SANHE.length;i++){
  var c2=SANHE[i];
  if(done[c2[3]]){continue;}
  var u2=[],ok2=true,t2;
  for(j=0;j<3;j++){t2=find(c2[j],u2);if(t2<0){ok2=false;break;}u2.push(t2);}
  if(ok2){var s2=0;for(j=0;j<3;j++){s2+=p[u2[j]];}
   hua[c2[3]]+=s2*K_SANHE;done[c2[3]]=1;
   ev.push({c:"e1",s:"<b>三合"+c2[0]+c2[1]+c2[2]+"</b>（"+lb(u2[0])+"·"+lb(u2[1])+"·"+lb(u2[2])+"）合化"+c2[3]+"局，"+c2[3]+"气增 +"+f1(s2*K_SANHE)});}}
 for(i=0;i<BANHE.length;i++){
  var b=BANHE[i];
  if(done[b[2]]){continue;}
  var ua=[],ta=find(b[0],ua);
  if(ta<0){continue;}
  ua.push(ta);
  var tb=find(b[1],ua);
  if(tb<0){continue;}
  var sb=p[ta]+p[tb];
  hua[b[2]]+=sb*K_BANHE;
  ev.push({c:"e1",s:"<b>半合"+b[0]+b[1]+"</b>（"+lb(ta)+"·"+lb(tb)+"）→"+b[2]+"，"+b[2]+"气增 +"+f1(sb*K_BANHE)});}
 for(i=0;i<n;i++){for(j=i+1;j<n;j++){
  if(CH[list[i].z]!==list[j].z){continue;}
  var hi=(p[i]>=p[j])?i:j,lo=(hi===i)?j:i;
  fac[hi]*=F_CHONG_HI;fac[lo]*=F_CHONG_LO;
  ev.push({c:"e2",s:"<b>"+lb(i)+"冲"+lb(j)+"</b>　"+lb(lo)+"力弱受损重（×"+F_CHONG_LO+"），"+lb(hi)+"力强损轻（×"+F_CHONG_HI+"）"});}}
 for(i=0;i<SANXING.length;i++){
  var x=SANXING[i],ux=[],okx=true,tx;
  for(j=0;j<3;j++){tx=find(x[j],ux);if(tx<0){okx=false;break;}ux.push(tx);}
  if(okx){for(j=0;j<3;j++){fac[ux[j]]*=F_XING3;}
   ev.push({c:"e2",s:"<b>三刑"+x[0]+x[1]+x[2]+"</b>（"+lb(ux[0])+"·"+lb(ux[1])+"·"+lb(ux[2])+"）三方俱耗，各 ×"+F_XING3});}}
 for(i=0;i<n;i++){for(j=i+1;j<n;j++){
  var a1=list[i].z,b1=list[j].z;
  if((a1==="子"&&b1==="卯")||(a1==="卯"&&b1==="子")){

   ev.push({c:"e2",s:"<b>"+lb(i)+"刑"+lb(j)+"</b>（子卯相刑）各 ×"+F_XING2});}}}
 for(k=0;k<ZIXING.length;k++){
  var cnt=[],zz=ZIXING[k];
  for(i=0;i<n;i++){if(list[i].z===zz){cnt.push(i);}}
  if(cnt.length>=2){for(i=0;i<cnt.length;i++){fac[cnt[i]]*=F_XING2;}
   ev.push({c:"e2",s:"<b>"+zz+zz+"自刑</b>（"+lb(cnt[0])+"·"+lb(cnt[1])+"）内耗，各 ×"+F_XING2});}}
 for(i=0;i<n;i++){for(j=i+1;j<n;j++){
  if(HAI[list[i].z]!==list[j].z){continue;}
  fac[i]*=F_HAI;fac[j]*=F_HAI;
  ev.push({c:"e3",s:"<b>"+lb(i)+"害"+lb(j)+"</b>　暗损，各 ×"+F_HAI});}}
 for(i=0;i<n;i++){for(j=i+1;j<n;j++){
  if(H6[list[i].z]!==list[j].z){continue;}

  ev.push({c:"e3",s:"<b>"+lb(i)+"合"+lb(j)+"</b>　各 ×"+F_LIUHE+add});}}
 return {fac:fac,ev:ev,hua:hua};

function monCoef(srcs){
 var mm={},i,k;
 for(k=0;k<5;k++){
  var el=EL5[k],s=0;
  for(i=0;i<srcs.length;i++){
   var sc=srcs[i];
   if(sc.k==="g"){s+=sc.w*GANMON[sc.v][el];}
   else{s+=sc.w*MON[sc.v][el];}}
  mm[el]=s;}
 return mm;}
function calc(P,extra,mmSrcs){
 var items=[],i,j,a,b,NM4=["年","月","日","时"];
 for(i=0;i<4;i++){items.push({g:P[i].gan,z:P[i].zhi,gw:POSW[i].g,zw:POSW[i].z,label:NM4[i],self:(i===2)});}
 for(i=0;i<extra.length;i++){var ex=extra[i];
  items.push({g:ex.g,z:ex.z,gw:EXW[ex.label].g,zw:EXW[ex.label].z,label:ex.label,self:false});}
 var mm=monCoef(mmSrcs),zl=[],p=[];
 for(i=0;i<items.length;i++){zl.push({z:items[i].z,label:items[i].label});
  p.push(items[i].zw*mm[ZE[items[i].z]]);}
 var R=relate(zl,p),gf=[],gev=[];
 for(i=0;i<items.length;i++){gf.push(1);}
 for(i=0;i<items.length;i++){for(j=i+1;j<items.length;j++){
  if(GANHE[items[i].g]!==items[j].g){continue;}
  gf[i]*=F_GANHE;gf[j]*=F_GANHE;
  var kk=GANHUA[items[i].g+items[j].g]?(items[i].g+items[j].g):(items[j].g+items[i].g);
  var ht=GANHUA[kk]?("，有化"+GANHUA[kk]+"之意"):"";
  gev.push({c:"e3",s:"<b>"+items[i].label+"干"+items[i].g+"合"+items[j].label+"干"+items[j].g+"</b>　各 ×"+F_GANHE+ht});}}
 function sum(u){
  var gw={},sv=0,q;
  for(q=0;q<10;q++){gw[GANS.charAt(q)]=0;}
  for(a=0;a<items.length;a++){
   var it=items[a],gv=it.gw*(u?gf[a]:1)*mm[E[it.g]];
   gw[it.g]+=gv;
   if(it.self){sv=gv;}
   var zp=p[a]*(u?R.fac[a]:1),hd=HIDE[it.z];
   for(b=0;b<hd.length;b++){var st=hd[b][0];
    gw[st]+=zp*hd[b][1]*mm[E[st]]/mm[ZE[it.z]];}}
  if(u){var h;
   for(h in R.hua){if(R.hua[h]){var v=R.hua[h]*mm[h],pr=EL2G[h];
    gw[pr[0]]+=v/2;gw[pr[1]]+=v/2;}}}
  var wx={"木":0,"火":0,"土":0,"金":0,"水":0};
  for(q=0;q<10;q++){var s3=GANS.charAt(q);wx[E[s3]]+=gw[s3];}
  return {gw:gw,wx:wx,sv:sv};}
 var raw=sum(false),adj=sum(true),dg=P[2].gan,de=E[dg],wx=adj.wx;
 var sc10={};
 for(i=0;i<10;i++){sc10[TEN[i]]=0;}
 for(i=0;i<10;i++){var st2=GANS.charAt(i);sc10[ss(dg,st2)]+=adj.gw[st2];}
 sc10["比肩"]-=adj.sv;
 if(sc10["比肩"]<0){sc10["比肩"]=0;}
 var sc={};
 for(i=0;i<5;i++){sc[SK[i]]=0;}
 for(i=0;i<10;i++){sc[S2C[TEN[i]]]+=sc10[TEN[i]];}
 var help=sc["比劫"]+sc["印"]+adj.sv,drain=sc["食伤"]+sc["财"]+sc["官杀"];
 var ratio=help/((help+drain)||1),state=stateOf(ratio);
 var tot=0;
 for(i=0;i<5;i++){tot+=sc[SK[i]];}
 var lv={};
 for(i=0;i<5;i++){var r=sc[SK[i]]/((tot/5)||1);
  lv[SK[i]]=(r>=TH5_HI)?"旺":((r<=TH5_LO)?"衰":"中");}
 var t10=0;
 for(i=0;i<10;i++){t10+=sc10[TEN[i]];}
 var lv10={};
 for(i=0;i<10;i++){var r2=sc10[TEN[i]]/((t10/10)||1);
  lv10[TEN[i]]=(r2>=TH10_HI)?"旺":((r2<=TH10_LO)?"衰":"中");}
 var ord=EL5.slice().sort(function(x,y){return wx[y]-wx[x];});
 var fav=["财","官杀","食伤"];
 if(state==="偏弱"){fav=["比劫","印"];}
 if(state==="偏旺"){fav=["食伤","财","官杀"];}
 return {wxRaw:raw.wx,wx:wx,sc:sc,sc10:sc10,lv:lv,lv10:lv10,state:state,ratio:ratio,
  ord:ord,mm:mm,ev:R.ev.concat(gev),de:de,dg:dg,fav:fav,selfV:adj.sv,
  help:help,drain:drain};
}

/* ===== SVG 折线图（纯手绘，无依赖） ===== */
function lineChart(pts,opt){
 /* pts: [{lab,sub,v,tag}]  v=0..100 */
 var w=opt.w||760,h=opt.h||230,pl=34,pr=10,pt2=14,pb=42;
 var iw=w-pl-pr,ih=h-pt2-pb,n=pts.length,i;
 if(n<2){return '<div class="meta">数据不足。</div>';}
 var step=iw/(n-1),s="";
 s+='<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img">';
 /* 身强/身弱带 */
 var yHi=pt2+ih*(1-ST_HI),yLo=pt2+ih*(1-ST_LO);
 s+='<rect x="'+pl+'" y="'+pt2+'" width="'+iw+'" height="'+(yHi-pt2)+'" fill="#2b3a2b" opacity=".55"/>';
 s+='<rect x="'+pl+'" y="'+yHi+'" width="'+iw+'" height="'+(yLo-yHi)+'" fill="#33301f" opacity=".5"/>';
 s+='<rect x="'+pl+'" y="'+yLo+'" width="'+iw+'" height="'+(pt2+ih-yLo)+'" fill="#3a2a28" opacity=".55"/>';
 /* 网格与刻度 */
 var ticks=[0,20,40,60,80,100];
 for(i=0;i<ticks.length;i++){
  var yy=pt2+ih*(1-ticks[i]/100);
  s+='<line x1="'+pl+'" y1="'+yy+'" x2="'+(pl+iw)+'" y2="'+yy+'" stroke="#3d342b" stroke-width="1"/>';
  s+='<text x="'+(pl-6)+'" y="'+(yy+4)+'" fill="#6f6660" font-size="10" text-anchor="end">'+ticks[i]+"</text>";}
 s+='<line x1="'+pl+'" y1="'+yHi+'" x2="'+(pl+iw)+'" y2="'+yHi+'" stroke="#6fb36f" stroke-width="1" stroke-dasharray="5,4"/>';
 s+='<line x1="'+pl+'" y1="'+yLo+'" x2="'+(pl+iw)+'" y2="'+yLo+'" stroke="#cf7363" stroke-width="1" stroke-dasharray="5,4"/>';
 s+='<text x="'+(pl+iw-2)+'" y="'+(yHi-4)+'" fill="#6fb36f" font-size="9" text-anchor="end">身强线 '+Math.round(ST_HI*100)+"</text>";
 s+='<text x="'+(pl+iw-2)+'" y="'+(yLo+11)+'" fill="#cf7363" font-size="9" text-anchor="end">身弱线 '+Math.round(ST_LO*100)+"</text>";
 /* 折线 */
 var path="",area="";
 for(i=0;i<n;i++){
  var x=pl+step*i,y=pt2+ih*(1-Math.max(0,Math.min(100,pts[i].v))/100);
  path+=(i?" L":"M")+x.toFixed(1)+" "+y.toFixed(1);
  area+=(i?" L":"M"+x.toFixed(1)+" "+(pt2+ih)+" L")+x.toFixed(1)+" "+y.toFixed(1);}
 area+=" L"+(pl+step*(n-1)).toFixed(1)+" "+(pt2+ih)+" Z";
 s+='<path d="'+area+'" fill="#d9b36a" opacity=".10"/>';
 s+='<path d="'+path+'" fill="none" stroke="#d9b36a" stroke-width="2.2" stroke-linejoin="round"/>';
 /* 点与标签 */
 for(i=0;i<n;i++){
  var x2=pl+step*i,y2=pt2+ih*(1-Math.max(0,Math.min(100,pts[i].v))/100);
  var col="#d9b36a";
  if(pts[i].v>ST_HI*100){col="#6fb36f";}
  if(pts[i].v<ST_LO*100){col="#cf7363";}
  var rr=pts[i].tag?4.6:3.4;
  if(pts[i].tag){s+='<circle cx="'+x2.toFixed(1)+'" cy="'+y2.toFixed(1)+'" r="8" fill="#d9b36a" opacity=".22"/>';}
  s+='<circle cx="'+x2.toFixed(1)+'" cy="'+y2.toFixed(1)+'" r="'+rr+'" fill="'+col+'"/>';
  if(n<=14||i%2===0){
   s+='<text x="'+x2.toFixed(1)+'" y="'+(y2-10).toFixed(1)+'" fill="#c9c2b8" font-size="9.5" text-anchor="middle">'+Math.round(pts[i].v)+"</text>";}
  if(n<=16){
   s+='<text x="'+x2.toFixed(1)+'" y="'+(pt2+ih+15)+'" fill="#9c9087" font-size="10" text-anchor="middle">'+pts[i].lab+"</text>";
   if(pts[i].sub){s+='<text x="'+x2.toFixed(1)+'" y="'+(pt2+ih+29)+'" fill="#6f6660" font-size="9.5" text-anchor="middle">'+pts[i].sub+"</text>";}
  }else if(i%3===0||i===n-1){
   s+='<text x="'+x2.toFixed(1)+'" y="'+(pt2+ih+15)+'" fill="#9c9087" font-size="9.5" text-anchor="middle">'+pts[i].lab+"</text>";
   if(pts[i].sub){s+='<text x="'+x2.toFixed(1)+'" y="'+(pt2+ih+28)+'" fill="#6f6660" font-size="9" text-anchor="middle">'+pts[i].sub+"</text>";}}}
 s+="</svg>";
 return s;
}

 var step=iw/(n-1),s='<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="xMidYMid meet" role="img">';
 s+='<line x1="'+pl+'" y1="'+(pt2+ih)+'" x2="'+(pl+iw)+'" y2="'+(pt2+ih)+'" stroke="#3d342b"/>';

  var el=EL5[k],d="";

   var x=pl+step*i,y=pt2+ih*(1-rows[i].wx[el]/mx);
   d+=(i?" L":"M")+x.toFixed(1)+" "+y.toFixed(1);}
  s+='<path d="'+d+'" fill="none" stroke="'+ELHEX[el]+'" stroke-width="1.8" opacity=".92"/>';}
 for(i=0;i<n;i++){
  if(n<=16||i%3===0||i===n-1){
   s+='<text x="'+(pl+step*i).toFixed(1)+'" y="'+(pt2+ih+14)+'" fill="#6f6660" font-size="9" text-anchor="middle">'+rows[i].lab+"</text>";}}
 s+="</svg>";
 var lg='<div class="lg">';
 for(k=0;k<5;k++){lg+='<span><i style="background:'+ELHEX[EL5[k]]+'"></i>'+EL5[k]+"</span>";}
 return s+lg+"</div>";
}

   html+="</div>";

   html+='<div class="card"><div class="h">前 后 七 日 比 较（点击可切换）</div><div class="scroll" id="d7">';

     var dd3=calcDay(MY,MM,i);

   /* 曲线模式下也给出当令月/日的详解 */
   var pk=(cv==="m12")?calcDay(parseInt($("gy").value,10),mxi+1,15):

   var ITp=interact(pk.c);

   for(k=0;k<doms.length;k++){
    var dk2=doms[k],R2=READ[dk2](B,pk.c,pk.f,ITp),ot2=[],t6;
    for(t6=0;t6<3&&t6<R2.zp.length;t6++){ot2.push(R2.zp[t6]);}

   html+="</div></div>";

    $("lnBox").innerHTML=s;
    var dd=$("dyBar").getElementsByClassName("dy"),q;
    for(q=0;q<dd.length;q++){
     dd[q].className="dy"+((parseInt(dd[q].getAttribute("data-i"),10)===idx)?" on":"");}};
   $("dyBar").addEventListener("click",function(e){
    var n=e.target;

   showLN((ci<0)?0:ci);}
  if($("d7")){
   $("d7").addEventListener("click",function(e){

 }catch(err){
  $("msg").textContent="排盘出错："+err.message;
 }
}
function boot(){
 initForm();
 if(typeof Solar!=="undefined"){run();return;}
 var s=document.createElement("script");
 s.src="https://unpkg.com/lunar-javascript/lunar.js";
 s.onload=function(){run();};
 s.onerror=function(){$("msg").textContent="历法库加载失败：请联网后刷新，或把 lunar.js 下载到同目录改为本地引用。";};

}
