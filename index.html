<style>

.gz{display:block;font:700 25px/1.25 serif}
.meta{font-size:13px;color:var(--dim)}

<div class="sub">旺衰为主（0.6）· 盲派为辅（0.4）· 合冲刑会后能量重算 · 流年月令并参</div>

<div class="card">
  <div class="h">命 主 信 息</div>
  <div class="grid">
    <div><label>性 别</label><div class="seg" id="sx"><button data-v="1" class="on">男命</button><button data-v="0">女命</button></div></div>
    <div><label>历 法</label><div class="seg" id="lf"><button data-v="s" class="on">阳历</button><button data-v="l">阴历</button></div></div>
    <div id="wS"><label>出生日期（阳历）</label><input type="date" id="sd" value="1990-05-20"></div>
    <div id="wL" style="display:none"><label>出生日期（农历）</label>
      <div style="display:flex;gap:6px"><input type="number" id="ly" value="1990" style="flex:1.1">
      <select id="lm" style="flex:1"></select><select id="ld" style="flex:1"></select></div>

  </div>
  <div class="hint">按钟表时间排盘，不作真太阳时换算。立春换年、节气换月、23:00 归次日子时由历法库处理。</div>
  <div style="margin-top:14px"><label>想了解哪些方面（可多选）</label>
    <div class="chips" id="dm">
      <span data-k="marriage" class="on">婚姻感情</span><span data-k="wealth" class="on">财运</span>
      <span data-k="child" class="on">子女</span><span data-k="career" class="on">事业工作</span>
      <span data-k="health" class="on">健康</span></div>
  </div>
  <button class="go" id="go">排 盘 解 读</button>
  <div class="err" id="msg"></div>
</div>

<div id="out"></div>
<div class="foot">本工具以子平旺衰为主轴、盲派宫位体用为辅，按程序规则推导，仅供传统文化研究与娱乐参考，<br>不构成医疗、婚恋、投资等任何专业建议。个人信息仅在本机浏览器计算，不会上传。</div>
</div>

<script>
/* ========== 可调参数 ========== */

var K_SANHUI=0.60, K_SANHE=0.50, K_BANHE=0.25, K_LIUHE_HUA=0.15;
var F_CHONG_HI=0.85, F_CHONG_LO=0.65, F_XING3=0.80, F_XING2=0.88, F_HAI=0.92, F_LIUHE=0.88, F_GANHE=0.90;

/* ========== 常量 ========== */
var GANS="甲乙丙丁戊己庚辛壬癸",ZHIS="子丑寅卯辰巳午未申酉戌亥";

var H6HUA={"子丑":"土","寅亥":"木","卯戌":"火","辰酉":"金","巳申":"水","午未":"土"};
var HAI={"子":"未","未":"子","丑":"午","午":"丑","寅":"巳","巳":"寅","卯":"辰","辰":"卯","申":"亥","亥":"申","酉":"戌","戌":"酉"};
var SANHE=[["申","子","辰","水"],["亥","卯","未","木"],["寅","午","戌","火"],["巳","酉","丑","金"]];
var SANHUI=[["寅","卯","辰","木"],["巳","午","未","火"],["申","酉","戌","金"],["亥","子","丑","水"]];
var BANHE=[["申","子","水"],["子","辰","水"],["亥","卯","木"],["卯","未","木"],["寅","午","火"],["午","戌","火"],["巳","酉","金"],["酉","丑","金"]];
var SANXING=[["寅","巳","申"],["丑","戌","未"]];
var ZIXING=["辰","午","酉","亥"];
var GANHE={"甲":"己","己":"甲","乙":"庚","庚":"乙","丙":"辛","辛":"丙","丁":"壬","壬":"丁","戊":"癸","癸":"戊"};
var GANHUA={"甲己":"土","乙庚":"金","丙辛":"水","丁壬":"木","戊癸":"火"};
/* 月令旺度：旺1.40 相1.20 休1.00 囚0.75 死0.80（土月以土为旺，带上季余气） */
var MON={
"寅":{"木":1.40,"火":1.20,"水":1.00,"土":0.80,"金":0.75},"卯":{"木":1.40,"火":1.20,"水":1.00,"土":0.80,"金":0.75},
"辰":{"土":1.35,"木":1.15,"火":1.05,"金":0.95,"水":0.90},
"巳":{"火":1.40,"土":1.20,"木":1.00,"金":0.80,"水":0.75},"午":{"火":1.40,"土":1.20,"木":1.00,"金":0.80,"水":0.75},
"未":{"土":1.35,"火":1.15,"金":1.05,"木":0.90,"水":0.80},
"申":{"金":1.40,"水":1.20,"土":1.00,"火":0.80,"木":0.75},"酉":{"金":1.40,"水":1.20,"土":1.00,"火":0.80,"木":0.75},
"戌":{"土":1.35,"金":1.15,"水":1.05,"火":0.90,"木":0.85},
"亥":{"水":1.40,"木":1.20,"金":1.00,"土":0.80,"火":0.75},"子":{"水":1.40,"木":1.20,"金":1.00,"土":0.80,"火":0.75},
"丑":{"土":1.35,"水":1.15,"木":1.05,"金":0.95,"火":0.80}};
var POSW=[{g:0.8,z:1.0},{g:1.0,z:1.6},{g:1.0,z:1.2},{g:0.8,z:1.0}];
var EXW={"大运":{g:0.9,z:1.1},"流年":{g:1.0,z:1.2}};
var WC={"木":"w1","火":"w2","土":"w3","金":"w4","水":"w5"};
var EL5=["木","火","土","金","水"];
var SK=["比劫","食伤","财","官杀","印"];
var ORG={"木":"肝胆、筋络、情绪郁结","火":"心脉、血压、睡眠与眼目","土":"脾胃、消化、肌肉","金":"肺与呼吸、皮肤、大肠","水":"肾与泌尿、腰膝、内分泌"};
var TIP={"木":"早睡舒肝、多走绿地、少动怒","火":"静心安神、控咖啡与宵夜","土":"三餐定时、忌生冷过饱","金":"护呼吸、少烟尘、常做深呼吸","水":"节欲护腰、足量饮水、忌久坐"};
var IND={"木":"文教、木作、植物、设计","火":"能源、电子、餐饮、传媒","土":"地产、建筑、农牧、仓储","金":"金融、机械、五金、医器","水":"物流、贸易、水务、信息"};
var DNM={marriage:"婚 姻 感 情",wealth:"财 运",child:"子 女",career:"事 业 工 作",health:"健 康"};
function $(i){return document.getElementById(i);}

 if(a===b){return sm?"比肩":"劫财";} if(SHENG[a]===b){return sm?"食神":"伤官";}

/* ========== 表单 ========== */
(function(){var i,o,MN=["正","二","三","四","五","六","七","八","九","十","冬","腊"];
 for(i=1;i<=12;i++){o=document.createElement("option");o.value=i;o.textContent=MN[i-1]+"月";$("lm").appendChild(o);} $("lm").value=4;
 var DD=["初一","初二","初三","初四","初五","初六","初七","初八","初九","初十","十一","十二","十三","十四","十五","十六","十七","十八","十九","二十","廿一","廿二","廿三","廿四","廿五","廿六","廿七","廿八","廿九","三十"];
 for(i=1;i<=30;i++){o=document.createElement("option");o.value=i;o.textContent=DD[i-1];$("ld").appendChild(o);} $("ld").value=26;

/* ========== 地支关系与能量重算 ========== */
function relate(list,p){
 var n=list.length,fac=[],ev=[],hua={"木":0,"火":0,"土":0,"金":0,"水":0},i,j,k,done={};
 for(i=0;i<n;i++){fac.push(1);}
 function find(z,u){for(var t=0;t<n;t++){if(list[t].z===z&&u.indexOf(t)<0){return t;}}return -1;}
 function lb(t){return list[t].label+list[t].z;}
 /* 三会 */
 for(i=0;i<SANHUI.length;i++){var c=SANHUI[i],u=[],ok=true;
  for(j=0;j<3;j++){var t=find(c[j],u);if(t<0){ok=false;break;}u.push(t);}
  if(ok){var s=0;for(j=0;j<3;j++){s+=p[u[j]];}
   hua[c[3]]+=s*K_SANHUI;done[c[3]]=1;
   ev.push({c:"e1",s:"<b>三会"+c[0]+c[1]+c[2]+"</b>（"+lb(u[0])+"·"+lb(u[1])+"·"+lb(u[2])+"）会成"+c[3]+"方，"+c[3]+"气大增 +"+(s*K_SANHUI).toFixed(1)});}}
 /* 三合 */
 for(i=0;i<SANHE.length;i++){var c2=SANHE[i];if(done[c2[3]]){continue;}
  var u2=[],ok2=true;
  for(j=0;j<3;j++){var t2=find(c2[j],u2);if(t2<0){ok2=false;break;}u2.push(t2);}
  if(ok2){var s2=0;for(j=0;j<3;j++){s2+=p[u2[j]];}
   hua[c2[3]]+=s2*K_SANHE;done[c2[3]]=1;
   ev.push({c:"e1",s:"<b>三合"+c2[0]+c2[1]+c2[2]+"</b>（"+lb(u2[0])+"·"+lb(u2[1])+"·"+lb(u2[2])+"）合化"+c2[3]+"局，"+c2[3]+"气增 +"+(s2*K_SANHE).toFixed(1)});}}
 /* 半合 */
 for(i=0;i<BANHE.length;i++){var b=BANHE[i];if(done[b[2]]){continue;}
  var ua=[],ta=find(b[0],ua);if(ta<0){continue;}ua.push(ta);
  var tb=find(b[1],ua);if(tb<0){continue;}
  var sb=p[ta]+p[tb];hua[b[2]]+=sb*K_BANHE;
  ev.push({c:"e1",s:"<b>半合"+b[0]+b[1]+"</b>（"+lb(ta)+"·"+lb(tb)+"）→"+b[2]+"，"+b[2]+"气增 +"+(sb*K_BANHE).toFixed(1)});}
 /* 六冲 */
 for(i=0;i<n;i++){for(j=i+1;j<n;j++){ if(CH[list[i].z]!==list[j].z){continue;}
  var hi=p[i]>=p[j]?i:j,lo=hi===i?j:i;
  fac[hi]*=F_CHONG_HI;fac[lo]*=F_CHONG_LO;
  ev.push({c:"e2",s:"<b>"+lb(i)+"冲"+lb(j)+"</b>　两败而不均："+lb(lo)+"力弱受损重（×"+F_CHONG_LO+"），"+lb(hi)+"力强损轻（×"+F_CHONG_HI+"）"});}}
 /* 三刑 */
 for(i=0;i<SANXING.length;i++){var x=SANXING[i],ux=[],okx=true;
  for(j=0;j<3;j++){var tx=find(x[j],ux);if(tx<0){okx=false;break;}ux.push(tx);}
  if(okx){for(j=0;j<3;j++){fac[ux[j]]*=F_XING3;}
   ev.push({c:"e2",s:"<b>三刑"+x[0]+x[1]+x[2]+"</b>（"+lb(ux[0])+"·"+lb(ux[1])+"·"+lb(ux[2])+"）三方俱耗，各 ×"+F_XING3});}}

  (c.state==="偏旺"?"气盛须宣泄，宜规律运动出汗，郁而不发反生病":"禀赋平和，守住作息即可少病"))+
  "；今年调养以补"+wk+"为主："+TIP[wk]+"。"));
 zp.push(Z("流年"+f.gz+"地支属"+ZE[f.z]+"，于本命"+(favCat(c,catOf(c,f.z))?"属喜用，气机相扶":"属忌，须防其所主之患")+
  "，相关为"+ORG[ZE[f.z]]+"。"));
 for(i=0;i<c.ev.length;i++){if(c.ev[i].c==="e2"){cg.push(c.ev[i].s.replace(/<[^>]+>/g,""));}}
 if(cg.length){mp.push(M("冲刑为病之门户——"+cg[0].split("　")[0]+"，此处所主之脏腑须按时检查，并防跌碰与旧伤复发。"));}
 var I=IT["gs_bj"];
 if(I.g.use&&mp.length<2){mp.push(M("官杀攻身："+I.g.t+"，"+(I.g.k>=0.9?"压力直接作用于身，睡眠与血压最先示警":"身尚能受，注意节律即可")+"。"));}
 if(mp.length<2&&f.hit.length){mp.push(M("本年"+f.hit[0].s+"，"+ORG[ZE[f.z]]+"易起反应，宜趁势做一次系统体检。"));}
 if(mp.length<2){mp.push(M("本年无显著冲刑应期，所患多由积习而来，重在改惯不在求药。"));}
 return {zp:zp,mp:mp};}
};
function catOf(c,zhi){var g=HIDE[zhi][0][0],s=ss(c.dg,g);
 return {"比肩":"比劫","劫财":"比劫","食神":"食伤","伤官":"食伤","正财":"财","偏财":"财","正官":"官杀","七杀":"官杀","正印":"印","偏印":"印"}[s];}
function favCat(c,k){return c.fav.indexOf(k)>=0;}
function isFav(c,f){return favCat(c,catOf(c,f.z))||favCat(c,{"比肩":"比劫","劫财":"比劫","食神":"食伤","伤官":"食伤","正财":"财","偏财":"财","正官":"官杀","七杀":"官杀","正印":"印","偏印":"印"}[ss(c.dg,f.g)]);}

/* ========== 主流程 ========== */
function run(){
 $("msg").textContent="";$("out").innerHTML="";
 try{
  if(typeof Solar==="undefined"){$("msg").textContent="历法库未加载，请联网后刷新页面。";return;}
  var sex=parseInt($("sx").querySelector(".on").getAttribute("data-v"),10);
  var lf=$("lf").querySelector(".on").getAttribute("data-v");
  var tp=($("tm").value||"12:00").split(":"),hh=parseInt(tp[0],10),mi=parseInt(tp[1],10),solar,i,j;
  if(lf==="s"){if(!$("sd").value){$("msg").textContent="请选择出生日期。";return;}
   var d=$("sd").value.split("-");solar=Solar.fromYmdHms(+d[0],+d[1],+d[2],hh,mi,0);
  }else{var y=parseInt($("ly").value,10),m=parseInt($("lm").value,10),dd=parseInt($("ld").value,10);
   if(!y){$("msg").textContent="请填写农历年份。";return;}
   if($("lp").checked){m=-m;}solar=Lunar.fromYmdHms(y,m,dd,hh,mi,0).getSolar();}
  var lunar=solar.getLunar(),ec=lunar.getEightChar(),B=basic(ec,lunar,solar,sex);
  var monB=B.P[1].zhi, C=calc(B.P,[],monB,null), ITC=interact(C);
  var ds=$("dm").getElementsByClassName("on"),doms=[];
  for(i=0;i<ds.length;i++){doms.push(ds[i].getAttribute("data-k"));}
  if(!doms.length){doms=["marriage","wealth","career"];}
  var yun=null,dys=[];try{yun=ec.getYun(sex);dys=yun.getDaYun();}catch(e){}

  /* 命盘 */
  var NM=["年 柱","月 柱","日 柱","时 柱"],GL=["祖上·根基","父母·事业宫","自身·夫妻宫","子女·晚景"],th="";
  for(i=0;i<4;i++){th+="<th>"+NM[i]+'<br><span style="font-weight:400;color:#9c9087;font-size:10px">'+GL[i]+"</span></th>";}
  function row(t,fn){var s='<tr><th class="rh">'+t+"</th>",k;
   for(k=0;k<4;k++){s+="<td>"+fn(B.P[k])+"</td>";}return s+"</tr>";}
  var html='<div class="card"><div class="h">命 盘</div><div class="meta">阳历 <b>'+B.solar+"</b>　农历 <b>"+B.lunar+
  "</b><br><i>"+(sex===1?"男命":"女命")+"</i>　生肖 <b>"+B.sxiao+"</b>　节气 <b>"+B.jq+"</b>　日主 <b>"+C.dg+"（"+C.de+
  "）</b>　身<b>"+C.state+"</b>　月令 <b>"+monB+"</b>（司令"+(function(){var t="",k;for(k=0;k<5;k++){if(C.mm[EL5[k]]>=1.35){t=EL5[k];}}return t||"土";})()+
  '）</div><table style="margin-top:12px"><tr><th class="rh"></th>'+th+"</tr>"+
  row("干支",function(p){return '<span class="gz">'+p.gz.charAt(0)+"<br>"+p.gz.charAt(1)+"</span>";})+
  row("十神",function(p){return p.sh;})+row("藏干",function(p){return p.hid.join(" ")||"-";})+
  row("支十神",function(p){return p.hsh.join("<br>")||"-";})+row("纳音",function(p){return p.ny;})+
  row("空亡",function(p){return p.kong;})+"</table></div>";

  /* 合冲刑会 */
  html+='<div class="card"><div class="h">合 冲 刑 会 — 能 量 重 算</div>';
  if(C.ev.length){html+='<ul class="evt">';
   for(i=0;i<C.ev.length;i++){html+='<li class="'+C.ev[i].c+'">'+C.ev[i].s+"</li>";}
   html+="</ul>";}
  else{html+='<div class="meta">命局地支之间无三会、三合、半合、六冲、三刑、子卯刑、自刑、六害、六合，天干亦无相合——各柱独立取用。</div>';}
  html+='<div class="hint">说明：三会 +'+K_SANHUI+"、三合 +"+K_SANHE+"、半合 +"+K_BANHE+"（按参与两三支之力加成于化神）；冲为强者×"+F_CHONG_HI+
  "、弱者×"+F_CHONG_LO+"；三刑×"+F_XING3+"；子卯刑与自刑×"+F_XING2+"；害×"+F_HAI+"；六合×"+F_LIUHE+"并化气；天干合×"+F_GANHE+"。系数在源码顶部可调。</div></div>";

  /* 五行 */
  var mx=1;for(i=0;i<5;i++){if(C.wx[EL5[i]]>mx){mx=C.wx[EL5[i]];}if(C.wxRaw[EL5[i]]>mx){mx=C.wxRaw[EL5[i]];}}
  html+='<div class="card"><div class="h">五 行 能 量（虚线＝未计合冲之基础值）</div><div class="bars">';
  for(i=0;i<5;i++){var el=EL5[i],a=C.wxRaw[el],b2=C.wx[el],dv=b2-a;
   html+="<span>"+el+'</span><span class="bar"><i class="'+WC[el]+'" style="width:'+Math.min(100,b2/mx*100)+
   '%"></i><u style="width:'+Math.min(100,a/mx*100)+'%"></u></span><span class="meta">'+b2.toFixed(1)+
   ' <span class="'+(dv>=0.05?"up":(dv<=-0.05?"dn":""))+'" style="font-size:11px">'+(dv>=0.05?"▲":(dv<=-0.05?"▼":"＝"))+Math.abs(dv).toFixed(1)+"</span></span>";}
  var sl=[];for(i=0;i<5;i++){sl.push(SK[i]+" <b>"+C.sc[SK[i]].toFixed(1)+"</b>（"+C.lv[SK[i]]+"）");}
  html+='</div><div class="meta" style="margin-top:10px">十神：'+sl.join("　")+"<br>帮身占比 <b>"+(C.ratio*100).toFixed(0)+
  "%</b> → 判<i>"+C.state+"</i>，喜用取 <b>"+C.fav.join("、")+"</b></div>";
  html+='<div class="h" style="margin:14px 0 8px">十 神 交 互（按旺衰配对定取舍）</div><ul class="evt">';
  var any=false;
  for(i=0;i<PAIRS.length;i++){var q=PAIRS[i],I=ITC[q.id];
   if(!I.g.use){html+='<li style="opacity:.45">'+q.nm+"（"+q.a+I.la+" / "+q.b+I.lb+"）── "+I.g.t+"，不出断语</li>";continue;}
   any=true;html+='<li class="'+(I.g.k>=0.9?"e2":"e3")+'"><b>'+q.nm+"</b>（"+q.a+I.la+" → "+q.b+I.lb+"）── "+I.g.t+"，作用力 "+I.g.k.toFixed(1)+"</li>";}
  html+="</ul>"+(any?"":'<div class="meta">无达到门限的交互。</div>')+"</div>";

  /* 大运 */
  var cy=new Date().getFullYear(),ci=-1;
  if(dys.length){
   for(i=0;i<dys.length;i++){if(cy>=dys[i].getStartYear()&&cy<=dys[i].getEndYear()){ci=i;}}
   html+='<div class="card"><div class="h">大 运</div><div class="meta" style="margin-bottom:10px">起运：出生后 <b>'+
   yun.getStartYear()+"</b> 年 <b>"+yun.getStartMonth()+"</b> 个月 <b>"+yun.getStartDay()+"</b> 天（"+(yun.isForward()?"顺行":"逆行")+
   '）</div><div class="scroll" id="dyBar">';
   var lim=Math.min(dys.length,12);
   for(i=0;i<lim;i++){var x=dys[i];
    html+='<div class="dy'+(i===(ci<0?0:ci)?" on":"")+'" data-i="'+i+'"><b>'+(x.getGanZhi()||"小运")+"</b>"+
    x.getStartAge()+"–"+x.getEndAge()+"岁<br>"+x.getStartYear()+"年起"+(i===ci?'<br><span style="color:#d9b36a">当前</span>':"")+"</div>";}
   html+='</div><div class="h" style="margin:14px 0 8px">流 年</div><div class="ln" id="lnBox"></div></div>';}
  function dyGz(yy){var k;for(k=0;k<dys.length;k++){if(yy>=dys[k].getStartYear()&&yy<=dys[k].getEndYear()){return dys[k].getGanZhi()||"";}}return "";}

  /* 去年 今年 明年 */
  var items=[[cy-1,"去年",""],[cy,"今年","now"],[cy+1,"明年",""]];
  html+='<div class="card"><div class="h">去 年 · 今 年 · 明 年（子平 '+(W_ZP*100)+'% ＋ 盲派 '+(W_MP*100)+'%）</div><div class="yr">';
  for(i=0;i<3;i++){
   var it=items[i],dg2=dyGz(it[0]),f=yinfo(B,it[0],dg2),ex=[];
   if(dg2){ex.push({g:dg2.charAt(0),z:dg2.charAt(1),label:"大运"});}
   ex.push({g:f.g,z:f.z,label:"流年"});
   var CY=calc(B.P,ex,monB,f.z), IT=interact(CY), hs=[],k;
   for(k=0;k<f.hit.length;k++){hs.push(f.hit[k].s);}
   /* 评分 */
   var zpS=50+(isFav(CY,f)?18:-14)+(CY.state==="中和"?6:0);
   var mpS=50,ke;
   for(k=0;k<f.hit.length;k++){ke=f.hit[k].t;mpS+=(ke==="合"?9:(ke==="冲"?-11:-5));}
   if(IT["st_gs"].g.use&&IT["st_gs"].g.k>=0.9){mpS-=8;}
   if(IT["c_gs"].g.use&&IT["c_gs"].g.k>=0.9){mpS+=7;}
   if(IT["bj_c"].g.use&&IT["bj_c"].g.k>=0.9){mpS-=6;}
   zpS=Math.max(5,Math.min(95,zpS));mpS=Math.max(5,Math.min(95,mpS));
   var tot2=Math.round(W_ZP*zpS+W_MP*mpS);
   html+='<div class="yb '+it[2]+'"><div class="yt">'+it[1]+"　"+it[0]+" 年<span>虚岁 "+(it[0]-solar.getYear()+1)+
   '</span></div><div class="ygz">'+f.gz+"<em>"+ss(C.dg,f.g)+"／"+ss(C.dg,HIDE[f.z][0][0])+(dg2?"　大运 "+dg2:"")+"</em></div>"+
   '<div class="meta" style="font-size:12px">'+(hs.length?hs.join("；"):"与四柱无刑冲合")+
   "<br>流年月令并参后：日主<i>"+CY.state+"</i>（帮身 "+(CY.ratio*100).toFixed(0)+"%），当令五行 <b>"+CY.ord[0]+"</b></div>"+
   '<div class="sb"><span>综合</span><span class="t"><i style="width:'+tot2+'%"></i></span><span>'+tot2+
   " 分</span></div><div class=\"pr\">子平 "+zpS+" × "+W_ZP+"　＋　盲派 "+mpS+" × "+W_MP+"</div>";
   for(k=0;k<doms.length;k++){var dk=doms[k],R=READ[dk](B,CY,f,IT),out=[],t2;
    for(t2=0;t2<3&&t2<R.zp.length;t2++){out.push(R.zp[t2]);}
    for(t2=0;t2<2&&t2<R.mp.length;t2++){out.push(R.mp[t2]);}
    html+='<div class="dom"><div class="dn2">'+DNM[dk]+"</div>"+out.join("")+"</div>";}
   html+="</div>";}
  html+="</div></div>";
  $("out").innerHTML=html;

  if(dys.length){
   var show=function(idx){var arr=dys[idx].getLiuNian(),s="",k2;
    for(k2=0;k2<arr.length;k2++){var l=arr[k2];
     s+="<span"+(l.getYear()===cy?' class="hi"':"")+">"+l.getYear()+" <b>"+l.getGanZhi()+"</b> "+l.getAge()+"岁</span>";}
    $("lnBox").innerHTML=s;
    var dd2=$("dyBar").getElementsByClassName("dy");
    for(k2=0;k2<dd2.length;k2++){dd2[k2].className="dy"+(parseInt(dd2[k2].getAttribute("data-i"),10)===idx?" on":"");}};
   $("dyBar").addEventListener("click",function(e){var n=e.target;
    while(n&&n!==this&&(!n.className||n.className.indexOf("dy")<0)){n=n.parentNode;}
    if(n&&n!==this){show(parseInt(n.getAttribute("data-i"),10));}});
   show(ci<0?0:ci);}
 }catch(err){$("msg").textContent="排盘出错："+err.message;}
}
$("go").addEventListener("click",run);
if(typeof Solar==="undefined"){
 var sc2=document.createElement("script");sc2.src="https://unpkg.com/lunar-javascript/lunar.js";
 sc2.onload=run;sc2.onerror=function(){$("msg").textContent="历法库加载失败：请联网后刷新，或把 lunar.js 下载到同目录改为本地引用。";};
 document.head.appendChild(sc2);
}else{run();}
</script>
